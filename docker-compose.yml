services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniware}
      POSTGRES_USER: ${POSTGRES_USER:-uniware}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uniware}
    volumes:
      - uniware_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uniware} -d ${POSTGRES_DB:-uniware}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-uniware}:${POSTGRES_PASSWORD:-uniware}@db:5432/${POSTGRES_DB:-uniware}
      APPROVED_EMAIL_DOMAIN: ${APPROVED_EMAIL_DOMAIN:-chula.ac.th}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-False}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-False}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  uniware_pgdata:
